<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worth the switch?</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="intro">
        <h1>Worth the switch?</h1>
        <p class="lede">Pick what you use now and what you're considering.</p>
      </div>

      <div class="picks">
        <label class="pick pick-now">
          <span class="eyebrow">Now</span>
          <span class="sel"><span class="mdot" id="dot-now"></span><select id="now"></select></span>
        </label>
        <button class="swap" id="swap" type="button" title="Swap" aria-label="Swap now and considering">⇄</button>
        <label class="pick pick-next">
          <span class="eyebrow">Considering</span>
          <span class="sel"><span class="mdot" id="dot-next"></span><select id="next"></select></span>
        </label>
      </div>
    </header>

    <fieldset class="prio">
      <legend>What matters more to you?</legend>
      <div class="seg" id="prio"></div>
    </fieldset>

    <section class="board-row">
      <div class="stage">
        <div class="verdict">
          <h2 id="v-head"></h2>
          <p id="v-sub"></p>
        </div>
        <div class="bars" id="bars" role="img">
          <div class="metric score">
            <div class="m-head"><span>Test score</span><span class="m-val" id="score-val"></span></div>
            <div class="lab lab-now"><span id="score-now"></span></div>
            <div class="track"><div class="clip"><i class="base" id="score-base"></i><i class="delta" id="score-delta"></i></div><i class="mark" id="score-mark"></i></div>
            <div class="lab lab-next"><span id="score-next"></span></div>
          </div>
          <div class="metric cost">
            <div class="m-head"><span>API cost per task</span><span class="m-val" id="cost-val"></span></div>
            <div class="lab lab-now"><span id="cost-now"></span></div>
            <div class="track"><div class="clip"><i class="base" id="cost-base"></i><i class="delta" id="cost-delta"></i></div><i class="mark" id="cost-mark"></i></div>
            <div class="lab lab-next"><span id="cost-next"></span></div>
          </div>
        </div>
      </div>

      <aside class="rank" aria-labelledby="rank-title">
        <div class="rank-head">
          <h2 id="rank-title">All models</h2>
          <span>Value / 100</span>
        </div>
        <ol id="rank-list"></ol>
        <button class="more" id="more" type="button" aria-expanded="false"></button>
      </aside>

    </section>

    <p class="sr-only" id="live" aria-live="polite"></p>

    <footer class="foot">
      Benchmark data: <a href="https://artificialanalysis.ai/" target="_blank" rel="noopener">Artificial Analysis</a>
      · API cost per task · Updated <span id="updated"></span> · ≈ read from their chart
    </footer>

    <noscript><p>This page needs JavaScript to work.</p></noscript>
  </main>

  <script src="src/data.js"></script>
  <script src="src/value.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
